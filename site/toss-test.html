<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>토스 송금 시험</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #191f28; --sub: #6b7684; --line: #e5e8eb; --blue: #3182f6; --ok: #2e9e5b; --warn: #d9622b; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171c; --card: #202027; --text: #ececf0; --sub: #9a9aa6; --line: #34343e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  a.btn { display: block; text-align: center; font-weight: 700; padding: 15px; border-radius: 12px; background: var(--blue); color: #fff; text-decoration: none; }
  p.acct { color: var(--sub); font-size: 14px; text-align: center; margin: 10px 0 0; }
  #msg { font-size: 14px; margin-top: 10px; min-height: 1.5em; text-align: center; }
  #msg.ok { color: var(--ok); } #msg.warn { color: var(--warn); }
</style>
</head>
<body>
<main>
  <h1>토스 송금 시험</h1>
  <div class="card">
    <a id="toss" class="btn" href="supertoss://send?amount=1000&amp;bank=%ED%86%A0%EC%8A%A4%EB%B1%85%ED%81%AC&amp;accountNo=100123297463&amp;origin=qr">토스로 1,000원 응원하기</a>
    <p class="acct">토스뱅크 1001-2329-7463</p>
    <div id="msg"></div>
  </div>
</main>
<script>
(function () {
  var ACCOUNT = '토스뱅크 100123297463';
  var msg = document.getElementById('msg');
  var mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/.test(navigator.platform));
  function say(text, cls) { msg.textContent = text; msg.className = cls; }
  function copy(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    var t = document.createElement('textarea'); t.value = text; t.setAttribute('readonly', ''); t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); return Promise.resolve(); } catch (e) { return Promise.reject(e); } finally { t.remove(); }
  }
  // The link itself opens Toss; copying the account is the fallback when Toss isn't there.
  document.getElementById('toss').addEventListener('click', function (e) {
    if (!mobile) e.preventDefault();
    copy(ACCOUNT).then(function () {
      say(mobile ? '토스가 안 열리면 복사된 계좌번호를 은행 앱에 붙여 넣어 주세요.'
                 : 'PC에서는 토스 앱을 열 수 없어요. 계좌번호를 복사해 뒀어요.', 'ok');
    }, function () { say('계좌번호: ' + ACCOUNT, 'warn'); });
  });
})();
</script>
</body>
</html>
