<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>카카오페이 응원 확인</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #191f28; --sub: #6b7684; --line: #e5e8eb; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17171c; --card: #202027; --text: #ececf0; --sub: #9a9aa6; --line: #34343e; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px 40px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
  a.btn { display: block; text-align: center; font-weight: 700; padding: 15px; border-radius: 12px; background: #fee500; color: #191919; text-decoration: none; }
  ul { margin: 12px 0 0; padding-left: 20px; color: var(--sub); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>카카오페이 응원 확인</h1>
  <div class="card">
    <a class="btn" href="https://qr.kakaopay.com/FKcOJKyOy1f405462" target="_blank" rel="noopener">💛 카카오페이로 응원</a>
    <ul>
      <li>송금 화면이 열리면 다시 쓸 수 있는 상태입니다. 송금은 하지 말고 닫으세요.</li>
      <li>"일일 접속량이 초과되었습니다"가 나오면 아직 한도에 걸린 상태입니다.</li>
    </ul>
  </div>
</main>
</body>
</html>
